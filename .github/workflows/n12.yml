name: N12 source replay

# This is a separate, maintainer-started N12 workflow. Pushes do not run it.
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      jobs:
        type: string
        default: auto
      runner:
        type: string
        default: ubuntu-latest
      fresh:
        type: boolean
        default: false
      resume_run:
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      profile:
        description: Source scope (final requires the unconditional final theorem)
        type: choice
        required: true
        default: final
        options:
          - registered
          - selected
          - final
      jobs:
        description: Lean threads per module (auto uses available CPUs)
        type: string
        default: auto
      runner:
        type: string
        default: ubuntu-latest
      fresh:
        description: Ignore saved progress and replay every module
        type: boolean
        default: false
      resume_run:
        description: Checkpoint run ID, auto for latest compatible run, or none
        type: string
        default: auto

permissions:
  contents: read
  actions: read

concurrency:
  group: n12-source-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    defaults:
      run:
        working-directory: projects/n12-refactored
        shell: bash
    env:
      N12_REPLAY_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Set five-hour progress deadline
        working-directory: ${{ runner.temp }}
        run: echo "N12_REPLAY_DEADLINE=$(( $(date +%s) + 5 * 60 * 60 ))" >> "$GITHUB_ENV"

      - name: Check out the selected N12 revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects/n12-refactored
            ci

      - name: Initialize this run's verification status
        run: python3 scripts/replay_state.py reset

      - name: Size CPU, memory and checkpoint space for this runner
        env:
          REQUESTED_JOBS: ${{ inputs.jobs }}
        run: python3 scripts/runner_resources.py --jobs "$REQUESTED_JOBS"

      - name: Check the source target without compiling
        run: python3 scripts/github_replay.py --plan --profile "$N12_REPLAY_PROFILE"

      - name: Install the pinned Linux Lean toolchain
        timeout-minutes: 15
        run: |
          set -euo pipefail
          n12_toolchain="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0"
          n12_complete="$n12_toolchain/.n12-toolchain-complete"
          if [[ -f "$n12_complete" && -x "$n12_toolchain/bin/lean" && -x "$n12_toolchain/bin/lake" \
                && -f "$n12_toolchain/lib/lean/Init.olean" && -f "$n12_toolchain/lib/lean/Std.olean" \
                && -f "$n12_toolchain/lib/lean/Lake.olean" ]]; then
            "$n12_toolchain/bin/lean" --version
            "$n12_toolchain/bin/lake" --version
            exit 0
          fi
          # An interrupted extraction can leave bin/lean before its libraries.
          # Re-extract the pinned release; only a complete install gets a marker.
          rm -f "$n12_complete"
          mkdir -p "$n12_toolchain"
          curl --fail --location --retry 3 --connect-timeout 30 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            | tar --zstd -xf - -C "$n12_toolchain" --strip-components=1
          "$n12_toolchain/bin/lean" --version
          "$n12_toolchain/bin/lake" --version
          test -f "$n12_toolchain/lib/lean/Init.olean"
          test -f "$n12_toolchain/lib/lean/Std.olean"
          test -f "$n12_toolchain/lib/lean/Lake.olean"
          touch "$n12_complete"

      - name: Restore saved completed modules
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          REPLAY_FRESH: ${{ inputs.fresh }}
        run: |
          if [[ "$REPLAY_FRESH" == true ]]; then RESUME_RUN=none; fi
          # Restore temporarily holds both the downloaded ZIP and staged objects;
          # use the OS floor here, then reserve archive space during compilation.
          python3 scripts/bounded.py --rss-mib "$N12_RSS_MIB" --free-gib "$N12_RESTORE_FREE_GIB" \
            --threads "$N12_LEAN_THREADS" --seconds 18000 --deadline "$N12_REPLAY_DEADLINE" \
            --receipt .verification/checkpoint-restore-resources.json -- \
            python3 -u scripts/checkpoint.py restore --profile "$N12_REPLAY_PROFILE" --run "$RESUME_RUN"

      - name: Replay until the five-hour deadline
        id: replay
        env:
          REPLAY_FRESH: ${{ inputs.fresh }}
        run: |
          args=(--profile "$N12_REPLAY_PROFILE" --jobs "$N12_LEAN_THREADS" --resume-run none)
          if [[ "$REPLAY_FRESH" == true ]]; then args+=(--fresh); fi
          # Setup/restore count toward the five hours. The final hour of the
          # job is reserved for shutdown, checkpoint packaging and upload.
          set +e
          python3 scripts/bounded.py --rss-mib "$N12_RSS_MIB" --free-gib "$N12_FREE_GIB" \
            --threads "$N12_LEAN_THREADS" --seconds 18000 --deadline "$N12_REPLAY_DEADLINE" \
            --receipt .verification/github-resources.json -- \
            python3 -u scripts/github_replay.py "${args[@]}"
          replay_status=$?
          set -e
          echo "exit_code=$replay_status" >> "$GITHUB_OUTPUT"
          python3 scripts/replay_stop.py --exit-code "$replay_status"

      - name: Package completed modules and their validation receipts
        id: checkpoint
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python3 scripts/checkpoint.py package --profile "$N12_REPLAY_PROFILE"

      - name: Save resumable proof progress
        id: saved
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: n12-${{ inputs.profile }}-checkpoint-${{ github.run_attempt }}
          path: projects/n12-refactored/.verification/artifacts/checkpoint.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
          overwrite: false

      - name: Upload source inventory, compiler output and resource evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: n12-${{ inputs.profile }}-evidence-${{ github.run_attempt }}
          path: |
            projects/n12-refactored/.verification/
            !projects/n12-refactored/.verification/artifacts/
            !projects/n12-refactored/.verification/checkpoint-download-*/**
            !projects/n12-refactored/.verification/checkpoint-stage-*/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          overwrite: false

      - name: Report whether verification finished or needs another run
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CHECKPOINT_UPLOAD: ${{ steps.saved.outcome }}
        run: python3 scripts/replay_state.py summary
